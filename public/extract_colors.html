<!DOCTYPE html>
<html>

<body>
    <img id="logo" src="logo.jpg" data-style="display:none;" crossorigin="anonymous">
    <div id="results">Analyzing...</div>
    <script>
        window.onload = function () {
            const img = document.getElementById('logo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const colorCounts = {};
            let totalPixels = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a < 10) continue; // Skip transparent
                // Skip white/near-white background
                if (r > 240 && g > 240 && b > 240) continue;
                // Skip black/near-black text if needed? Let's keep it but maybe deprioritize.

                const rgb = `${r},${g},${b}`;
                colorCounts[rgb] = (colorCounts[rgb] || 0) + 1;
                totalPixels++;
            }

            // Sort colors by frequency
            const sortedColors = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]);

            // Get top distinctive colors (simple logic: ignore similar colors)
            const topColors = [];

            const isDistinct = (rgb1, rgb2) => {
                const [r1, g1, b1] = rgb1.split(',').map(Number);
                const [r2, g2, b2] = rgb2.split(',').map(Number);
                const dist = Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
                return dist > 50; // Threshold
            };

            for (const [color, count] of sortedColors) {
                if (topColors.length >= 3) break;
                if (topColors.every(c => isDistinct(c, color))) {
                    // Convert to Hex
                    const [r, g, b] = color.split(',').map(Number);
                    const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                    topColors.push(hex);
                }
            }

            document.getElementById('results').textContent = JSON.stringify(topColors);
        };
    </script>
</body>

</html>
